<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frogman Eyeballs Follow Mouse</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #1b2f68, #0a1230 55%, #050917);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .frog-stage {
      width: min(84vmin, 90vw);
      aspect-ratio: 1 / 1;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      user-select: none;
      -webkit-user-drag: none;
    }

    .frog-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .socket-rim {
      fill: none;
      stroke: none;
    }

    .motion-permission {
      position: fixed;
      left: 50%;
      bottom: 1.1rem;
      transform: translateX(-50%);
      z-index: 10;
      border: 0;
      border-radius: 999px;
      padding: 0.7rem 1.1rem;
      color: #f5f8ff;
      background: rgba(10, 18, 48, 0.86);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      font-size: 0.92rem;
      line-height: 1.1;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <main class="frog-stage">
    <svg id="frog-svg" class="frog-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Frogman portrait with moving eyeballs">
      <defs>
        <clipPath id="left-eye-clip" clipPathUnits="userSpaceOnUse">
          <ellipse cx="33.5" cy="31.2" rx="6.85" ry="6.2" />
        </clipPath>
        <clipPath id="right-eye-clip" clipPathUnits="userSpaceOnUse">
          <ellipse cx="71.3" cy="31.2" rx="6.85" ry="6.2" />
        </clipPath>
        <mask id="face-with-eye-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
          <rect x="0" y="0" width="100" height="100" fill="white" />
          <ellipse cx="33.5" cy="31.2" rx="6.85" ry="6.2" fill="black" />
          <ellipse cx="71.3" cy="31.2" rx="6.85" ry="6.2" fill="black" />
        </mask>
        <filter id="socket-softness" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="0.28" />
        </filter>
      </defs>

      <ellipse cx="33.5" cy="31.2" rx="7.25" ry="6.55" fill="none" filter="url(#socket-softness)" />
      <ellipse cx="71.3" cy="31.2" rx="7.25" ry="6.55" fill="none" filter="url(#socket-softness)" />

      <g clip-path="url(#left-eye-clip)">
        <image id="left-eyeball" href="frog.jpg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" />
      </g>
      <g clip-path="url(#right-eye-clip)">
        <image id="right-eyeball" href="frog.jpg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" />
      </g>

      <image href="frog.jpg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" mask="url(#face-with-eye-holes)" />
      <ellipse class="socket-rim" cx="33.5" cy="31.2" rx="6.95" ry="6.28" />
      <ellipse class="socket-rim" cx="71.3" cy="31.2" rx="6.95" ry="6.28" />
    </svg>
  </main>
  <button id="motion-permission" class="motion-permission" type="button" hidden>
    Enable gyroscope eye tracking
  </button>

  <script>
    const svg = document.getElementById("frog-svg");
    const motionPermissionButton = document.getElementById("motion-permission");
    const eyes = [
      { image: document.getElementById("left-eyeball"), cx: 33.5, cy: 31.2, maxTravel: 1.45, yBias: 0.88 },
      { image: document.getElementById("right-eyeball"), cx: 71.3, cy: 31.2, maxTravel: 1.45, yBias: 0.88 },
    ];
    let motionActive = false;
    let motionListening = false;
    let neutralBeta = null;
    let neutralGamma = null;
    const smoothedMotion = { x: 0, y: 0 };

    function moveByVector(horizontal, vertical) {
      eyes.forEach((eye) => {
        const dx = horizontal;
        const dy = vertical * eye.yBias;
        const distance = Math.hypot(dx, dy) || 1;
        const clamped = Math.min(distance, eye.maxTravel);
        const tx = (dx / distance) * clamped;
        const ty = (dy / distance) * clamped;

        eye.image.setAttribute("transform", `translate(${tx} ${ty})`);
      });
    }

    function moveEyeballs(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const pointerX = ((clientX - rect.left) / rect.width) * 100;
      const pointerY = ((clientY - rect.top) / rect.height) * 100;

      eyes.forEach((eye) => {
        const dx = pointerX - eye.cx;
        const dy = (pointerY - eye.cy) * eye.yBias;
        const distance = Math.hypot(dx, dy) || 1;
        const clamped = Math.min(distance, eye.maxTravel);
        const tx = (dx / distance) * clamped;
        const ty = (dy / distance) * clamped;

        eye.image.setAttribute("transform", `translate(${tx} ${ty})`);
      });
    }

    function resetEyeballs() {
      eyes.forEach((eye) => eye.image.removeAttribute("transform"));
    }

    window.addEventListener("mousemove", (event) => {
      if (motionActive) {
        return;
      }
      moveEyeballs(event.clientX, event.clientY);
    });

    window.addEventListener("touchmove", (event) => {
      if (motionActive) {
        return;
      }
      const touch = event.touches[0];
      if (touch) {
        moveEyeballs(touch.clientX, touch.clientY);
      }
    }, { passive: true });

    function getOrientationAngle() {
      if (window.screen.orientation && typeof window.screen.orientation.angle === "number") {
        return window.screen.orientation.angle;
      }
      if (typeof window.orientation === "number") {
        return window.orientation;
      }
      return 0;
    }

    function orientationToEyeVector(beta, gamma) {
      const maxTilt = 30;
      const deadzone = 1.6;
      if (neutralBeta === null) {
        neutralBeta = beta ?? 0;
      }
      if (neutralGamma === null) {
        neutralGamma = gamma ?? 0;
      }

      const relativeBeta = (beta ?? 0) - neutralBeta;
      const relativeGamma = (gamma ?? 0) - neutralGamma;
      const normalizedAngle = (((Math.round(getOrientationAngle() / 90) * 90) % 360) + 360) % 360;

      let horizontal = relativeGamma;
      let vertical = relativeBeta;

      if (normalizedAngle === 90) {
        horizontal = relativeBeta;
        vertical = -relativeGamma;
      } else if (normalizedAngle === 270) {
        horizontal = -relativeBeta;
        vertical = relativeGamma;
      } else if (normalizedAngle === 180) {
        horizontal = -relativeGamma;
        vertical = -relativeBeta;
      }

      horizontal = Math.max(-maxTilt, Math.min(maxTilt, horizontal));
      vertical = Math.max(-maxTilt, Math.min(maxTilt, vertical));
      if (Math.abs(horizontal) < deadzone) {
        horizontal = 0;
      }
      if (Math.abs(vertical) < deadzone) {
        vertical = 0;
      }
      const maxTravel = Math.min(...eyes.map((eye) => eye.maxTravel));
      return {
        x: (horizontal / maxTilt) * maxTravel,
        y: (vertical / maxTilt) * maxTravel,
      };
    }

    function handleDeviceOrientation(event) {
      if (typeof event.beta !== "number" || typeof event.gamma !== "number") {
        return;
      }

      motionActive = true;
      const vector = orientationToEyeVector(event.beta, event.gamma);
      smoothedMotion.x += (vector.x - smoothedMotion.x) * 0.24;
      smoothedMotion.y += (vector.y - smoothedMotion.y) * 0.24;
      moveByVector(smoothedMotion.x, smoothedMotion.y);
    }

    function resetMotionCalibration() {
      neutralBeta = null;
      neutralGamma = null;
      smoothedMotion.x = 0;
      smoothedMotion.y = 0;
    }

    async function requestMotionPermissionIfNeeded() {
      const requesters = [];
      [window.DeviceOrientationEvent, window.DeviceMotionEvent].forEach((eventType) => {
        if (
          eventType &&
          typeof eventType.requestPermission === "function" &&
          !requesters.includes(eventType)
        ) {
          requesters.push(eventType);
        }
      });

      if (requesters.length === 0) {
        return true;
      }

      try {
        for (const eventType of requesters) {
          const permission = await eventType.requestPermission();
          if (permission !== "granted") {
            return false;
          }
        }
      } catch {
        return false;
      }

      return true;
    }

    async function enableGyroscopeTracking() {
      const hasDeviceOrientation = typeof window.DeviceOrientationEvent !== "undefined";
      if (!hasDeviceOrientation || motionListening) {
        return;
      }

      const permissionGranted = await requestMotionPermissionIfNeeded();
      if (!permissionGranted) {
        motionPermissionButton.hidden = false;
        return;
      }

      motionListening = true;
      motionActive = false;
      resetMotionCalibration();
      window.addEventListener("deviceorientation", handleDeviceOrientation, { passive: true });
      motionPermissionButton.hidden = true;
    }

    function initMotionControls() {
      const hasDeviceOrientation = typeof window.DeviceOrientationEvent !== "undefined";
      if (!hasDeviceOrientation) {
        return;
      }

      const requiresPermission =
        typeof window.DeviceOrientationEvent.requestPermission === "function" ||
        (typeof window.DeviceMotionEvent !== "undefined" &&
          typeof window.DeviceMotionEvent.requestPermission === "function");

      if (requiresPermission) {
        motionPermissionButton.hidden = false;
        motionPermissionButton.addEventListener("click", enableGyroscopeTracking);
      } else {
        enableGyroscopeTracking();
      }
    }

    window.addEventListener("mouseleave", resetEyeballs);
    window.addEventListener("blur", resetEyeballs);
    window.addEventListener("orientationchange", resetMotionCalibration);
    initMotionControls();
  </script>
</body>
</html>
